spring:
  application:
    name: identity-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    # Своя база пользователей (database-per-service). Пароли — BCrypt-хеши — живут только здесь.
    url: jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5432}/${IDENTITY_DB_NAME:identity}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      leak-detection-threshold: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Схемой владеет Liquibase; validate только сверяет.
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/changelog.yml

  kafka:
    # Только продюсер: журнал аудита для insights-service. По умолчанию — внешний листенер
    # брокера для запуска из IDE, в compose — kafka:9092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

    template:
      # Отправка и получение сообщений становятся спанами, а traceparent едет заголовком
      # сообщения: трассу можно проследить из одного сервиса в другой через Kafka.
      observation-enabled: true
    producer:
      # Записи журнала терять нельзя: подтверждение от всех реплик и идемпотентный продюсер,
      # как у остальных сервисов.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  grpc:
    server:
      # Права на рестораны для каталога и монолита. По умолчанию — для запуска из IDE,
      # в docker-compose переопределяется на 9090.
      port: ${GRPC_PORT:7085}

app:
  security:
    # Первый администратор. Пустые значения — учётка не создаётся вовсе.
    bootstrap-admin:
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}
    jwt:
      issuer: ${JWT_ISSUER:food-delivery-platform}
      # Access-токен короткий: отозвать его до истечения нельзя, он проверяется без похода
      # в базу. Долгую сессию держит refresh-токен — его отзыв срабатывает сразу.
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
      # Закрытый ключ подписи: PKCS#8 DER в Base64 одной строкой. Значения по умолчанию нет —
      # ключ не должен лежать в репозитории даже «для разработки». Как сгенерировать — в README.
      private-key: ${JWT_PRIVATE_KEY:}
      key-id: ${JWT_KEY_ID:}

  audit:
    # Отправка журнала административных действий в сводный журнал insights-service.
    publish-interval: ${AUDIT_PUBLISH_INTERVAL:PT5S}
    publish-enabled: ${AUDIT_PUBLISH_ENABLED:true}

  auth:
    # Чистка истёкших refresh-токенов. Несколько экземпляров могут чистить одновременно:
    # DELETE по сроку идемпотентен.
    refresh-token-cleanup-interval: ${REFRESH_TOKEN_CLEANUP_INTERVAL:PT1H}

management:
  # Трассировка. Спаны собирает Micrometer Tracing поверх OpenTelemetry и отправляет по OTLP
  # в Tempo. Сквозной идентификатор trace живёт рядом с X-Correlation-Id, а не вместо него:
  # метка запроса — наша, она едет и через то, что трассировка не покрывает (outbox, очереди).
  tracing:
    sampling:
      # В локальном стеке — все запросы. В боевом этого слишком много: 0.1 и ниже.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  otlp:
    tracing:
      export:
        # Выключено по умолчанию: запуск из IDE и тесты не должны сыпать в лог ошибками
        # о недоступном Tempo. Docker Compose включает через TRACING_EXPORT_ENABLED=true.
        enabled: ${TRACING_EXPORT_ENABLED:false}
    metrics:
      export:
        # Метрики по-прежнему снимает Prometheus; стартер тянет OTLP-реестр метрик,
        # и без этой строки он слал бы то же самое второй раз.
        enabled: false
  server:
    port: ${MANAGEMENT_PORT:9085}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{userId:-}] "
  level:
    root: INFO
    com.dima.fooddelivery: DEBUG
