# Значения переменных окружения для тестов сервиса пользователей. Адреса и пароли контейнеров
# подставляет @ServiceConnection и перекрывает значения ниже.
IDENTITY_DB_USER=test
IDENTITY_DB_PASSWORD=test

# Ключ подписи токенов — только для тестов: сгенерирован отдельно, нигде больше не используется
# и защищать в нём нечего. Настоящий ключ в репозиторий не попадает никогда.
JWT_PRIVATE_
JWT_KEY_ID=test-key

# gRPC-сервер на случайном свободном порту.
spring.grpc.server.port=0
